<h2>{{ heading() }}</h2>

<ng-content />

<button
  class="list-toggle"
  type="button"
  (click)="toggleList()"
  [attr.aria-expanded]="listOpen()"
  [attr.aria-label]="'Mostrar lista de ' + heading()">
  <span>{{ countLabel() }}</span>
  <span>{{ listOpen() ? '×' : '☰' }}</span>
</button>

@if (listOpen()) {
  <ul class="entry-list">
    @for (entry of entries(); track entry.id) {
      @let paid = paidIds().has(entry.id);
      <li>
        <span class="description">{{ entry.description }}</span>

        <div class="details">
          <span class="branch" aria-hidden="true">└─</span>
          <strong>{{ entry.value | currency }}</strong>

          @if (showPaidStatus()) {
            <button
              class="status-badge"
              type="button"
              [class.is-paid]="paid"
              (click)="togglePaid.emit(entry)"
              [attr.aria-label]="(paid ? 'Marcar como não pago: ' : 'Marcar como pago: ') + entry.description"
            >
              {{ paid ? 'Pago' : 'Não pago' }}
            </button>
          }


          <div class="actions">
            <button
              class="icon-button"
              type="button"
              (click)="edit.emit(entry)"
              [attr.aria-label]="'Editar ' + itemLabel() + ': ' + entry.description"
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 20h9" />
                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
              </svg>
            </button>
            <button
              class="icon-button remove-button"
              type="button"
              (click)="remove.emit(entry.id)"
              [attr.aria-label]="'Remover ' + itemLabel() + ': ' + entry.description"
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 7h16" />
                <path d="M10 11v6M14 11v6" />
                <path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12" />
                <path d="M9 7V4h6v3" />
              </svg>
            </button>
          </div>
        </div>
      </li>
    } @empty {
      <li class="empty">Nenhum lançamento neste mês</li>
    }
  </ul>
}

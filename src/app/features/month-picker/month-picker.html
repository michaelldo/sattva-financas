<button
  class="month-trigger"
  type="button"
  (click)="toggle()"
  [attr.aria-expanded]="isOpen()"
  aria-haspopup="true"
>
  <span class="month-label">{{ label() }}</span>
  <span class="chevron" [class.open]="isOpen()">⌄</span>
</button>

@if (isOpen()) {
  <div class="month-panel" [class.month-panel--start]="align() === 'start'">
    <div class="month-panel__header">
      <button type="button" (click)="changeYear(-1)" aria-label="Ano anterior">&lt;</button>
      <strong>{{ viewedYear() }}</strong>
      <button type="button" (click)="changeYear(1)" aria-label="Próximo ano">&gt;</button>
    </div>

    <div class="month-grid">
      @for (option of options(); track option.value) {
        <button
          type="button"
          [class.is-selected]="option.value === month()"
          [attr.aria-pressed]="option.value === month()"
          (click)="select(option.value)"
        >
          {{ option.label }}
        </button>
      }
    </div>
  </div>
}

<button
  class="month-trigger"
  type="button"
  (click)="toggle()"
  [attr.aria-expanded]="isOpen()"
  aria-haspopup="true"
>
  <span class="month-label">{{ label() }}</span>
  <span class="chevron" [class.open]="isOpen()" aria-hidden="true">
    <svg
      width="14"
      height="14"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="m6 9 6 6 6-6" />
    </svg>
  </span>
</button>

@if (isOpen()) {
  <div class="month-panel" [class.month-panel--start]="align() === 'start'">
    <div class="month-panel__header">
      <button type="button" (click)="changeYear(-1)" aria-label="Ano anterior">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="m15 6-6 6 6 6" />
        </svg>
      </button>
      <strong>{{ viewedYear() }}</strong>
      <button type="button" (click)="changeYear(1)" aria-label="Próximo ano">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="m9 6 6 6-6 6" />
        </svg>
      </button>
    </div>

    <div class="month-grid">
      @for (option of options(); track option.value) {
        <button
          type="button"
          [class.is-selected]="option.value === month()"
          [class.is-today]="option.value === today"
          [attr.aria-pressed]="option.value === month()"
          [attr.aria-current]="option.value === today ? 'date' : null"
          (click)="select(option.value)"
        >
          {{ option.label }}
        </button>
      }
    </div>
  </div>
}

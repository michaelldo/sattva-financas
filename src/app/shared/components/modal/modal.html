<!-- O clique no fundo é só um atalho de mouse. No teclado o <dialog> nativo já fecha com o ESC -->
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<dialog
  #dialog
  [class.wide]="wide()"
  [class.drawer]="variant() === 'drawer'"
  [attr.aria-labelledby]="titleId"
  (close)="close()"
  (click)="closeOnBackdropClick($event)"
>
  <div class="surface">
    <header>
      <h2 [id]="titleId">{{ heading() }}</h2>
      <button type="button" (click)="close()" aria-label="Fechar">×</button>
    </header>

    <ng-content />
  </div>
</dialog>
